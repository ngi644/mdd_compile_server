; platformio.ini - M5Stack boards template
[platformio]
default_envs = m5stack-atoms3

[env]
platform = espressif32
framework = arduino

; ライブラリ依存関係
lib_deps = 
    m5stack/M5Unified@^0.1.6

; ビルド設定
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0

; シリアルモニター設定
monitor_speed = 115200


[env:m5stack-atoms3]
board = m5stack-atoms3

[env:m5stack-atoms3-lite]
board = m5stack-atoms3-lite

[env:m5stack-core2]
board = m5stack-core2

[env:m5stack-cores3]
board = m5stack-cores3

[env:m5stick-c-plus2]
board = m5stick-c-plus2
